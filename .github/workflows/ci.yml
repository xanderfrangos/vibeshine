---
# Release branch build: every push builds Windows unsigned and keeps the
# installer, MSI and portable ZIP as run artifacts. Nothing is signed or published.
name: CI
permissions: {}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Package version for this build (defaults to the RELEASE_BUILD_VERSION repo variable)
        type: string
        default: ''
      build_tests:
        description: Compile and execute the full Windows test suite
        type: boolean
        default: false
  push:
    branches:
      - release

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      use_self_hosted: false
      # build_only stops before the setup EXE; without a SignPath token the
      # packaging jobs take their unsigned path and skip signing entirely.
      build_only: false
      build_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.build_tests }}
      release_commit: ${{ github.sha }}
      release_version: ${{ inputs.release_version || vars.RELEASE_BUILD_VERSION || '2.0.0-pr-validation' }}
      release_artifact_retention_days: 14
      symbol_product_name: Vibeshine
      symbol_release_prefix: shine
      publish_symbols: false
      require_truehdr_runtime: false
